<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>尼采 · 最后一年 ｜ 数字孪生沉浸书</title>
<link rel="preconnect" href="https://fonts.googleapis.cn">
<link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
<link href="https://fonts.googleapis.cn/css2?family=Noto+Serif+SC:wght@400;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ec; --paper2:#f2ead9; --card:rgba(255,253,247,.74);
    --ink:#231b11; --ink2:#443827; --dim:#867552; --faint:#a8977a;
    --gold:#a8863c; --gold2:#c4a258; --line:rgba(120,95,40,.16); --line2:rgba(120,95,40,.10);
    --fork:#a8423b; --fork2:#9c3a34; --fork-soft:rgba(168,66,59,.10);
    --up:#3a7d52; --down:#a23b32; --shadow:0 14px 40px rgba(80,60,20,.14);
    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","STZhongsong","FangSong",Georgia,"Times New Roman",serif;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:
      radial-gradient(130% 90% at 50% -15%, #fdfaf3 0%, var(--paper) 50%, var(--paper2) 100%);
    color:var(--ink);font-family:var(--serif);line-height:1.9;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(156,122,46,.3);border-radius:5px}
  a{color:var(--gold)}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:var(--paper);z-index:200;color:var(--dim);letter-spacing:.2em;font-size:.9rem}
  #loader .ring{width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 顶栏进度 */
  .topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;
    padding:11px 22px;background:rgba(244,236,216,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .topbar .tb-title{font-weight:600;letter-spacing:.14em;color:var(--gold);font-size:.92rem;white-space:nowrap}
  .topbar .tb-prog{flex:1;height:4px;background:var(--line2);border-radius:3px;overflow:hidden}
  .topbar .tb-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}
  .topbar .tb-meta{font-size:.74rem;color:var(--dim);white-space:nowrap;letter-spacing:.05em}

  .layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto;padding:40px 26px 170px}
  @media(max-width:980px){.layout{grid-template-columns:1fr;gap:0;padding:24px 16px 160px}.rail{display:none}}

  /* 左栏：生命向量 + 推演透明 */
  .rail{position:sticky;top:78px;align-self:start;height:calc(100vh - 100px);overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  .rail-h{font-size:.7rem;letter-spacing:.26em;color:var(--gold);text-transform:uppercase;margin:0 0 10px}
  .rail-h:not(:first-child){margin-top:16px}
  .rdim{display:grid;grid-template-columns:42px 1fr 34px;gap:7px;align-items:center;margin-bottom:7px}
  .rdim .rn{font-size:.72rem;color:var(--ink2)}
  .rdim .rtrack{height:7px;background:var(--line2);border-radius:4px;overflow:hidden}
  .rdim .rtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px;transition:width .6s ease}
  .rdim .rv{font-size:.7rem;color:var(--dim);text-align:right;font-family:var(--mono)}
  .rail-compute{font-size:.74rem;color:var(--ink2);line-height:1.7}
  .rail-compute .rc-in{color:var(--dim)}
  .rail-compute .rc-d{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .rail-compute .pill{font-family:var(--mono);font-size:.68rem;padding:1px 7px;border-radius:10px;border:1px solid var(--line)}
  .pill.up{color:var(--up);border-color:rgba(47,125,79,.4)}
  .pill.down{color:var(--down);border-color:rgba(168,57,47,.4)}
  .rail-compute .rc-god{margin-top:7px;color:var(--gold);font-style:italic}
  .rail-viz{margin:2px 0 4px}
  #trajChart svg{width:100%;display:block}
  .traj-legend{display:flex;flex-wrap:wrap;gap:8px;margin:5px 0 2px;font-size:.64rem;color:var(--dim)}
  .traj-legend .lg-cur{color:var(--gold2)}
  .traj-legend .lg-base{color:#9a8f7e}
  .traj-legend .lg-fork{color:var(--fork)}
  .radar-wrap{display:flex;justify-content:center;margin-top:2px}
  #radarChart{width:158px;max-width:100%}
  #radarChart svg{width:100%}
  .stat{font-size:.76rem;color:var(--ink2);line-height:1.7;margin-top:2px}
  .stat-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line2);padding:3px 0}
  .stat-row:last-child{border-bottom:none}
  .stat-row span{color:var(--dim)}
  .stat-row b{color:var(--gold);font-weight:600;text-align:right}

  /* 阅读主栏 */
  .book{max-width:700px;margin:0 auto;width:100%}
  .ch{min-height:86vh;padding:10px 4px 44px;scroll-snap-align:start}
  .ch-fig{margin:0 0 26px;padding:9px;background:var(--paper);border:1px solid var(--gold);border-radius:9px;box-shadow:var(--shadow)}
  .ch-fig img{width:100%;display:block;border-radius:4px;filter:saturate(1.02) contrast(1.03) brightness(1.03);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .ch-cap{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;color:var(--dim);text-align:center;margin-top:9px;text-transform:uppercase}
  .ch-no{font-size:.72rem;letter-spacing:.36em;color:var(--gold);text-transform:uppercase}
  .ch-date{font-size:.78rem;color:var(--dim);margin:4px 0 3px;font-family:var(--mono)}
  .ch-title{font-size:2rem;line-height:1.34;color:var(--ink);margin:6px 0 18px;font-weight:700;letter-spacing:.02em}
  .ch-lead{font-size:1.14rem;line-height:2.12;color:var(--ink);margin:0 0 22px;text-align:justify}
  .ch-lead::first-letter{float:left;font-size:3.6rem;line-height:.8;padding:8px 13px 0 0;color:var(--gold);font-weight:700}
  .ch-sub{font-size:.76rem;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin:32px 0 13px;
    border-bottom:1px solid var(--line);padding-bottom:7px}
  .act{font-size:1.05rem;line-height:2.06;margin:0 0 13px;color:var(--ink2);text-align:justify}
  .act .who{color:var(--gold);font-weight:600;cursor:pointer;border-bottom:1px dotted var(--gold)}
  .act .who:hover{color:var(--gold2)}
  .act em{color:var(--ink);font-style:italic}
  .emerge{margin:22px 0;padding:15px 19px;border-left:3px solid var(--gold);background:rgba(168,134,60,.08);
    border-radius:0 10px 10px 0;font-style:italic;color:var(--gold);font-size:1.04rem;line-height:1.95}
  .synth{font-size:1.04rem;line-height:2.02;color:var(--ink2);text-align:justify;margin:0 0 8px}
  .micro{list-style:none;margin:6px 0 0;padding:0;font-size:.84rem;color:var(--dim);font-family:var(--mono);line-height:1.85}
  .micro li{padding:4px 0;border-bottom:1px dashed var(--line2)}
  .micro li b{color:var(--ink2);font-weight:600}

  details.compute{margin:22px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
  details.compute summary{cursor:pointer;padding:11px 0;font-size:.82rem;letter-spacing:.08em;color:var(--gold);font-weight:600}
  details.compute .c-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 0 16px}
  @media(max-width:560px){details.compute .c-grid{grid-template-columns:1fr}}
  .c-box h4{margin:0 0 8px;font-size:.72rem;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-weight:600}
  .c-box p{margin:0 0 7px;font-size:.86rem;color:var(--ink2);line-height:1.7}
  .c-deltas{font-family:var(--mono);font-size:.78rem;display:flex;flex-wrap:wrap;gap:5px}
  .c-deltas span{padding:1px 7px;border-radius:9px;border:1px solid var(--line)}
  .c-deltas .up{color:var(--up);border-color:rgba(47,125,79,.4)}
  .c-deltas .down{color:var(--down);border-color:rgba(168,57,47,.4)}

  .notes{margin:24px 0;display:flex;flex-direction:column;gap:10px}
  .note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:12px 15px}
  .note .nt{font-size:.82rem;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:8px}
  .note .nt .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .note .nf{font-size:.9rem;color:var(--ink2);line-height:1.8;margin-top:6px}
  .note .ns{font-size:.74rem;color:var(--dim);margin-top:8px;font-style:italic}
  .note .ntag{display:inline-block;font-size:.68rem;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--dim);margin-top:7px}

  .ch-god{margin:26px 0 10px;background:rgba(156,122,46,.07);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .ch-god .gq{font-size:.86rem;color:var(--ink2);margin:0 0 10px;line-height:1.7}
  .ch-god .grow{display:flex;gap:9px;flex-wrap:wrap}
  .ch-god input{flex:1;min-width:200px;background:#fffdf6;border:1px solid var(--line);color:var(--ink);
    padding:9px 12px;border-radius:8px;font-family:var(--serif);font-size:.9rem}
  .ch-god button{background:var(--gold);color:#fff7e6;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;
    font-family:var(--serif);font-size:.86rem;letter-spacing:.05em;transition:.15s}
  .ch-god button:hover{background:var(--gold2)}
  .ch-god .gdone{margin-top:10px;padding:11px 13px;border-radius:10px;background:linear-gradient(135deg,rgba(168,134,60,.14),var(--fork-soft));border:1px solid rgba(168,134,60,.4);font-style:normal;animation:gdPop .5s ease}
  @keyframes gdPop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .gdone .gd-tag{display:inline-block;font-weight:700;color:var(--gold2);font-size:.84rem;letter-spacing:.5px}
  .gdone .gd-text{font-style:italic;color:var(--ink2);font-size:.82rem;margin-top:4px}
  .gdone .gd-deltas{margin-top:8px;font-family:var(--mono);font-size:.76rem;line-height:1.95;color:var(--ink2)}
  .gdone .gd-deltas b.up{color:var(--up);font-weight:700}
  .gdone .gd-deltas b.down{color:var(--down);font-weight:700}
  .gdone .gd-foot{margin-top:8px;font-size:.72rem;color:var(--dim)}
  .ch-goded{box-shadow:inset 4px 0 0 var(--gold);background:linear-gradient(90deg,rgba(156,122,46,.06),transparent 42%)}
  .ch-forked{background:linear-gradient(90deg,var(--fork-soft),transparent 40%)}
  .forked-badge{display:inline-block;margin:0 0 8px;padding:3px 11px;border-radius:20px;background:var(--fork-soft);border:1px solid rgba(168,66,59,.35);color:var(--fork2);font-size:.72rem;letter-spacing:.5px;animation:fbPulse 1.6s ease-in-out infinite}
  @keyframes fbPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
  .fate-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,30px);max-width:min(560px,92vw);background:linear-gradient(135deg,#fffdf6,#f7efe0);border:1.5px solid var(--gold);border-radius:14px;box-shadow:0 14px 46px rgba(90,65,20,.26);padding:15px 20px;opacity:0;transition:opacity .4s,transform .4s;z-index:120;pointer-events:none}
  .fate-toast.show{opacity:1;transform:translate(-50%,0)}
  .fate-toast .ft-head{font-size:1.05rem;font-weight:800;color:var(--fork2);letter-spacing:1px;margin-bottom:5px}
  .fate-toast .ft-body{font-size:.86rem;color:var(--ink);line-height:1.6}
  .fate-toast .ft-body b{color:var(--gold2)}
  .fate-toast .ft-delta{margin-top:7px;font-family:var(--mono);font-size:.8rem;color:var(--ink2)}
  .fate-toast .ft-delta .up{color:var(--up);font-weight:700}
  .fate-toast .ft-delta .down{color:var(--down);font-weight:700}
  .fate-toast .ft-hint{margin-top:7px;font-size:.66rem;color:var(--dim);line-height:1.5}

  /* 序言与终章 */
  .intro .ch-title{font-size:2.3rem}
  .intro p{font-size:1.04rem;line-height:2.05;color:var(--ink2);text-align:justify;margin:0 0 16px}
  .intro .lead-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:18px 0}
  .intro .lead-card b{color:var(--gold)}
  .intro ul{margin:8px 0 16px;padding-left:22px;color:var(--ink2);font-size:1rem;line-height:1.95}
  .intro ul li{margin-bottom:7px}
  .report .ch-title{font-size:2.1rem}
  .report .rblock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
  .report .rblock h4{margin:0 0 10px;font-size:.76rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
  .report .rblock p{margin:0;font-size:1.02rem;line-height:2;color:var(--ink2);text-align:justify}
  .report .rthemes{display:flex;flex-wrap:wrap;gap:8px}
  .report .rthemes span{font-size:.82rem;border:1px solid var(--line);border-radius:12px;padding:4px 12px;color:var(--ink2)}
  .report .rai{font-size:.8rem;color:var(--dim);margin-top:10px;font-style:italic}
  .report .rbtn{background:var(--gold);color:#fff7e6;border:none;padding:12px 22px;border-radius:9px;cursor:pointer;
    font-family:var(--serif);font-size:.95rem;letter-spacing:.06em;margin-top:8px}
  .report .rbtn:hover{background:var(--gold2)}
  .report .rbtn:disabled{opacity:.5;cursor:default}

  /* 上帝视角悬浮按钮 */
  .god-fab{position:fixed;right:22px;bottom:22px;z-index:70;background:var(--gold);color:#fff7e6;border:none;
    padding:12px 18px;border-radius:30px;cursor:pointer;font-family:var(--serif);font-size:.88rem;letter-spacing:.05em;
    box-shadow:0 8px 24px rgba(120,90,30,.35);transition:.18s}
  .god-fab:hover{background:var(--gold2);transform:translateY(-2px)}
  .god-fab .gcx{margin-left:8px;opacity:.7}

  /* 性格卡 */
  .psyche-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
    background:rgba(40,30,15,.42);backdrop-filter:blur(3px)}
  .psyche-modal.show{display:flex}
  .psyche-card{width:min(560px,92vw);max-height:88vh;overflow:auto;background:var(--paper);border:1px solid var(--line);
    border-radius:18px;padding:26px 28px;box-shadow:0 24px 70px rgba(60,40,10,.4);animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  .psyche-card h3{margin:0 0 2px;font-size:1.5rem;color:var(--ink)}
  .psyche-card .pc-role{color:var(--dim);font-size:.8rem;letter-spacing:.08em;margin-bottom:16px}
  .psyche-card .pc-row{margin-bottom:13px}
  .psyche-card .pc-k{font-size:.68rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
  .psyche-card .pc-v{font-size:.96rem;color:var(--ink2);line-height:1.75;margin-top:3px}
  .psyche-card .pc-ties{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .psyche-card .pc-ties span{font-size:.78rem;border:1px solid var(--line);border-radius:14px;padding:2px 11px;color:var(--dim);cursor:pointer}
  .psyche-card .pc-ties span:hover{color:var(--gold);border-color:var(--gold)}
  .psyche-card .pc-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--dim);font-size:1.4rem;cursor:pointer}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="loader"><div class="ring"></div><div>正在唤醒数字孪生……</div></div>

<header class="topbar">
  <div class="tb-title">尼采 · 最后一年 ｜ 数字孪生沉浸书</div>
  <div class="tb-prog"><i id="tbProg"></i></div>
  <div class="tb-meta" id="tbMeta">载入中</div>
</header>

<div class="layout">
  <aside class="rail" id="rail">
    <div class="rail-h">生命轨迹 · 八维折线</div>
    <div id="trajChart" class="rail-viz"></div>
    <div class="traj-legend"><span class="lg-cur">━ 当前世界线</span><span class="lg-base">┄ 未改写原线</span><span class="lg-fork">▮ 分叉带</span></div>
    <div class="rail-h">生命向量 · 八维</div>
    <div id="railDims" class="rail-dims"></div>
    <div class="rail-h">本章推演</div>
    <div id="railCompute" class="rail-compute"></div>
    <div class="rail-h">当前章雷达</div>
    <div class="radar-wrap"><div id="radarChart"></div></div>
    <div class="rail-h">世界线统计</div>
    <div id="statPanel" class="stat"></div>
  </aside>
  <main class="book" id="book"></main>
</div>

<button class="god-fab" id="godFab">✎ 改写这一幕<span class="gcx" id="godFabIx"></span></button>

<div class="psyche-modal" id="psycheModal">
  <div class="psyche-card" id="psycheCard"></div>
</div>

<script>
/* ===================== 真实推演引擎（与 caiban 后端同源） ===================== */
let WORLD=null, DIMS=[], SCENE_BASE='scenes/', BASE_CH=[];
const DCOLOR={'health':'#2f7d4f','fame':'#c4a258','solitude':'#6a7fb5','thought':'#7a5cae','will':'#c0623a','love':'#a8423b','suffering':'#a23b32','freedom':'#3a8fa0'};
function $(id){return document.getElementById(id);}
function clamp(v){return Math.max(0,Math.min(100,v));}
function rng(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hseed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function computeRelDeltas(reqTick, actorIds, godVar){
  const rd={};
  const getEdge=(oid)=>(WORLD.graph||[]).find(e=>(e.from==='nietzsche'&&e.to===oid)||(e.to==='nietzsche'&&e.from===oid));
  const drift=(oid,d)=>{const e=getEdge(oid);if(e){const k=e.from+'>'+e.to;rd[k]=Math.round(((rd[k]||0)+d)*1000)/1000;}};
  for(const id of actorIds){if(id==='nietzsche')continue;const e=getEdge(id);if(!e)continue;
    const t=e.type;let d=0;
    if(t==='ally'||t==='family'||t==='mentor')d=0.025;
    else if(t==='love')d=0.02;
    else if(t==='mirror')d=0.02;
    else if(t==='antagonist'||t==='rival')d=-0.035;
    if(d)drift(id,d);}
  const beats={1:{cosima:-0.05},4:{brandes:0.06,fame:0.05},8:{driver:-0.12,horse:0.18,overbeck:0.14},10:{elisabeth:-0.22,foerster:-0.12,fame:0.12},11:{fame:0.22,public:0.18,elisabeth:-0.1,lou:0.08}};
  if(beats[reqTick])Object.entries(beats[reqTick]).forEach(([k,v])=>drift(k,v));
  return rd;
}
function localSim(reqTick,state,worldMood,seed,godVar){
  const w=WORLD;const chrono=w.chronology[Math.min(reqTick,w.chronology.length-1)];
  const isFinal=!!chrono.final||reqTick>=w.chronology.length-1;
  const actors=chrono.actors||[];const AB=w.sim.actionBank||{},MB=w.sim.moodBank||{},MO=w.sim.monologueBank||{},EF=w.sim.effects||{};
  const r=rng(hseed(String(seed)+':'+reqTick));const pick=a=>a&&a.length?a[Math.floor(r()*a.length)%a.length]:'（静默）';
  const pickN=(a,n)=>{if(!a||!a.length)return [];const idx=[...Array(a.length).keys()];for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}return idx.slice(0,Math.min(n,a.length)).map(i=>a[i]);};
  const actorOut=[],events=[],deltas={},godDeltas={};DIMS.forEach(d=>{deltas[d.k]=0;godDeltas[d.k]=0;});
  deltas.health-=1;deltas.solitude+=1;
  const scale=isFinal?2.6:1+Math.min(reqTick*0.06,0.7);
  for(const id of actors){const a=w.agents.find(x=>x.id===id);if(!a)continue;
    const acts=pickN(AB[id],2);const mood=pick(MB[id]);
    const monos=pickN(MO[id]||[],2);

    if(/争|战|锤|抗|怒/.test(g)){bump('will',3);bump('suffering',1);}if(/信|神|祷|灵|马/.test(g)){bump('suffering',-2);bump('love',1);}
    if(/名|声|刊|版/.test(g))bump('fame',3);if(/烧|弃|忘|放/.test(g)){bump('freedom',2);bump('suffering',1);}
    bump('freedom',2);}
  const MBank=(WORLD.sim&&WORLD.sim.micro)||{};const mIds=Object.keys(MBank).filter(id=>MBank[id]&&MBank[id].length);

    const txt=arr[Math.floor(r()*arr.length)%arr.length];micro.push({who:a.name,id,text:txt,kind:'micro'});
    const d=DIMS[Math.floor(r()*DIMS.length)].k;deltas[d]+=(r()<0.5?1:-1);}

  else if(reqTick===8)emergent='名字在身后升起，也被剪辑与挪用——他一生抗拒的简化，正以最盛大的方式降临。';

      health:'身体仍在替他扛着思想的重量，这一幕里它成了不被注意的锚。',

      thought:'思想在暗处自己生长，比他写下的跑得更远。',
      will:'意志在这一幕悄悄收拢，像拳，而非掌。',
      love:'爱的缺口还在，他绕着它走，又忍不住回头。',

    actorOut.slice(0,3).map(x=>x.name+(x.actions[0]||'')).join('；')+'。';

}
function computeEnding(s){
  const hi=k=>s[k]>=60,lo=k=>s[k]<=40;let tone,sigil;
  if(hi('will')&&hi('suffering')){tone='悲剧英雄';sigil='你承受了最深的痛，却把它炼成了一柄锤。';}
  else if(hi('love')&&lo('solitude')){tone='联结者';sigil='你在思想之外，也学会了与人温暖相处。';}
  else if(hi('thought')&&lo('fame')){tone='孤峰';sigil='你生前的文字无人问津，却在身后成为世纪的惊雷。';}
  else if(hi('freedom')&&hi('solitude')){tone='漫游者';sigil='你一生无国无家，却比谁都自由。';}
  else if(hi('fame')){tone='名震';sigil='你的名字成了时代的回声，也为你招来误读。';}
  else if(hi('suffering')&&lo('will')){tone='破碎';sigil='痛赢了你，你没能把它变成武器。';}
  else if(hi('thought')&&hi('will')){tone='超人雏形';sigil='你既是作者，也是自己的读者——你在自己身上克服了人。';}
  else{tone='未竟之人';sigil='你的一生像未完成的乐句，悬在半空，等后人续写。';}
  const extra=[];
  if(hi('health'))extra.push('身体竟成了你最忠实的盟友，撑住了思想的重量。');
  else if(lo('health'))extra.push('身体早早背叛了你，你用意志一路代偿。');
  if(hi('freedom'))extra.push('你始终拒绝被任何阵营收编，连「信徒」都不肯当。');
  if(lo('love')&&hi('solitude'))extra.push('爱与联结，是你终其一生没解开的那个扣。');
  if(hi('fame')&&hi('thought'))extra.push('当思想与声名同至，误解也如影随形。');
  if(hi('will')&&lo('suffering'))extra.push('你很少被痛打倒，更多是自己选定了方向。');
  if(extra.length===0)extra.push('没有一种力量独大，你的世界线在张力中保持着危险平衡。');
  let recur;
  if(hi('will')&&!lo('suffering'))recur='永恒轮回的恶魔问你：愿再来一遍吗？你说——愿。这是祝福。';
  else if(hi('suffering')&&lo('will'))recur='恶魔问你：愿再来一遍吗？你别过了脸。这是诅咒。';
  else recur='恶魔的问题悬而未决；你既未全然肯定，也未全然否定——而这犹疑，本身也是一种答案。';
  const top=[...DIMS].sort((a,b)=>s[b.k]-s[a.k]).slice(0,3).map(d=>d.name).join('·');
  return {tone,sigil,extra,recur,sign:`世界线签名：${top} 主导 —— 一条只属于你的尼采。`};
}

function simTrajectory(godObj){
  const base={...(WORLD.base||{})};
  let mood=0.3, state={...base};
  const total=(WORLD.chronology||[]).length;
  const chs=[];
  for(let t=0;t<total;t++){
    const god=godObj[t]||'';
    const res=localSim(t,state,mood,READER_SEED,god);
    for(const d of DIMS)state[d.k]=clamp(state[d.k]+(res.deltas&&res.deltas[d.k]||0));
    mood=(typeof res.worldMood==='number')?res.worldMood:mood;
    chs.push({tick:t,state:{...state},deltas:res.deltas||{},godDeltas:res.godDeltas||{},res,god});
  }
  return chs;
}

function drawTraj(){

  let ghost='';
  if(BASE_CH.length===n){
    DIMS.forEach(d=>{const pts=BASE_CH.map((c,i)=>`${X(i).toFixed(1)},${Y(c.state[d.k]||0).toFixed(1)}`).join(' ');ghost+=`<polyline points="${pts}" fill="none" stroke="${DCOLOR[d.k]}" stroke-width="1.1" opacity=".22" stroke-dasharray="2 2"/>`;});
  }
  // 金色分叉带：从第一个被改写的章到结局
  const fi=firstGodIdx();
  let band='';
  if(fi>=0){ const x0=X(fi); band=`<rect x="${x0.toFixed(1)}" y="${pt}" width="${(X(n-1)-x0).toFixed(1)}" height="${TH-pt-pb}" fill="rgba(168,66,59,.10)"/>`+
    `<line x1="${x0.toFixed(1)}" y1="${pt}" x2="${x0.toFixed(1)}" y2="${TH-pb}" stroke="#a8423b" stroke-width="1.2" stroke-dasharray="2 2"/>`+
    `<text x="${(x0+2).toFixed(1)}" y="${pt+8}" font-size="7" fill="#a8423b">⚡分叉</text>`; }
  // 当前（被改写后的）轨迹
  let paths='';
  DIMS.forEach(d=>{const pts=CH.map((c,i)=>`${X(i).toFixed(1)},${Y(c.state[d.k]||0).toFixed(1)}`).join(' ');paths+=`<polyline points="${pts}" fill="none" stroke="${DCOLOR[d.k]}" stroke-width="1.4" opacity=".9"/>`;});
  $('trajChart').innerHTML=`<svg viewBox="0 0 ${TW} ${TH}" preserveAspectRatio="none">${ghost}${band}<line id="trajHl" x1="${X(0)}" y1="${pt}" x2="${X(0)}" y2="${TH-pb}" stroke="#a8863c" stroke-width="1.3" stroke-dasharray="3 3"/>${paths}</svg>`;
}
function updateTrajHighlight(i){const line=$('trajHl');if(!line)return;const TW=240,pl=4,pr=4,n=totalCh;if(!n)return;const X=pl+(TW-pl-pr)*(i/(n-1));line.setAttribute('x1',X);line.setAttribute('x2',X);}
function drawRadar(idx){const ch=CH[idx];if(!ch)return;const S=158,cx=S/2,cy=S/2,R=S/2-18,N=DIMS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;const pt=(i,v)=>{const r=R*((v||0)/100);return [cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];};
  let grid='',axes='',labels='',dots='';
  [0.25,0.5,0.75,1].forEach(f=>{const p=DIMS.map((d,i)=>`${(cx+R*f*Math.cos(ang(i))).toFixed(1)},${(cy+R*f*Math.sin(ang(i))).toFixed(1)}`).join(' ');grid+=`<polygon points="${p}" fill="none" stroke="rgba(120,95,40,.15)" stroke-width="1"/>`;});
  DIMS.forEach((d,i)=>{const x=cx+R*Math.cos(ang(i)),y=cy+R*Math.sin(ang(i));axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(120,95,40,.12)" stroke-width="1"/>`;const lx=cx+(R+10)*Math.cos(ang(i)),ly=cy+(R+10)*Math.sin(ang(i));labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="7.5" fill="#867552" text-anchor="middle" dominant-baseline="middle">${d.name}</text>`;});
  const poly=DIMS.map((d,i)=>{const [x,y]=pt(i,ch.state[d.k]||0);return `${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
  dots=DIMS.map((d,i)=>{const [x,y]=pt(i,ch.state[d.k]||0);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.1" fill="${DCOLOR[d.k]}"/>`;}).join('');
  $('radarChart').innerHTML=`<svg viewBox="0 0 ${S} ${S}" width="100%"><polygon points="${poly}" fill="rgba(168,134,60,.16)" stroke="#a8863c" stroke-width="1.5"/>${grid}${axes}${dots}${labels}</svg>`;
}

/* 命运分叉摘要弹层：把"改写后果"量化、夸张地展示出来 */
function showFateToast(){
  const forked=[];
  for(let i=0;i<totalCh;i++){ if(stateDiff(CH[i].state,BASE_CH[i].state)>0.5) forked.push(i); }
  if(!forked.length) return;
  const first=forked[0], last=forked[forked.length-1];
  // 终态相对原线偏移最大的维度
  let bd='',bv=0; DIMS.forEach(d=>{const v=(CH[totalCh-1].state[d.k]||0)-(BASE_CH[totalCh-1].state[d.k]||0); if(Math.abs(v)>Math.abs(bv)){bv=v;bd=d.name;}});
  // 全程累计偏移（所有章所有维绝对差之和）
  let totalShift=0; for(let i=0;i<totalCh;i++) totalShift+=stateDiff(CH[i].state,BASE_CH[i].state);
  const dcls=bv>0?'up':'down';
  const el=document.createElement('div');
  el.className='fate-toast';
  el.innerHTML=`<div class="ft-head">⚡ 命运分叉</div>`+
    `<div class="ft-body">你改写了<b>第 ${first+1} 幕</b>，<b>${forked.length}</b> 个下游章节因此改写——`+
    `这条世界线已与原线分道扬镳。</div>`+
    `<div class="ft-delta">终态最大偏移：<span class="${dcls}">${bd} ${bv>0?'+':''}${bv}</span>　·　全程累计偏移 ${totalShift}</div>`+
    `<div class="ft-hint">灰色虚线＝未改写原线 ｜ 金色带＝分叉后命运 ｜ 下游章节标「✦ 因你改写而变」</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),450); }, 5200);
}

/* ===================== 滚动联动 ===================== */
function setupObserver(){
  const secs=[...document.querySelectorAll('.ch[data-i]')].filter(s=>/^\d+$/.test(s.dataset.i));
  if(!('IntersectionObserver' in window)){ renderRail(0); return; }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ const i=+en.target.dataset.i; if(!isNaN(i)){ currentIdx=i; renderRail(i); } } });
  },{rootMargin:'-45% 0px -45% 0px',threshold:0});
  secs.forEach(s=>io.observe(s));
}

const DEEPSEEK={key:"__DEEPSEEK_KEY__",model:"deepseek-v4-pro",base:"https://api.deepseek.com"};
const SYSTEM_REPORT_DEEPSEEK=`你是「数字孪生」的 ReportAgent。基于一条已跑完的尼采最后一年平行世界线，写出一份深度复盘：

async function deepseekReportClient(b){
  if(!DEEPSEEK.key)return null;
  const themes=(WORLD.worldThemes||[]).map(t=>t.name).join('、');
  const stateLine=DIMS.map(d=>`${d.k}:${Math.round(b.state[d.k]||0)}`).join(' ');
  const traj=b.feed.map(f=>{const evs=(f.events||[]).map(e=>`[${e.kind}]${e.text}`).join(' ');return `· 第${f.reqTick+1}幕 ${f.calendar?.date||''}《${f.calendar?.label||''}》${f.calendar?.final?'〔终幕〕':''}｜${evs}`;}).join('\n');
  const godLine=(b.godLog&&b.godLog.length)?b.godLog.join('；'):'（无——最忠于史料，无人从外部改写）';
  const user=`【宏观文明力场库】${themes}\n\n【终态生命向量】${stateLine}\n\n【上帝视角注入】${godLine}\n\n【这条世界线的演化轨迹】\n${traj}\n\n请写出这份终幕复盘，只返回 JSON。`;
  const payloadJson=JSON.stringify({model:DEEPSEEK.model,messages:[{role:'system',content:SYSTEM_REPORT_DEEPSEEK},{role:'user',content:user}],response_format:{type:'json_object'},thinking:{type:'enabled'},reasoning_effort:'medium',temperature:0.85,max_tokens:3500});
  let rep=null;
  for(let attempt=0;attempt<2&&!rep;attempt++){
    try{
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),120000);
      const r=await fetch(DEEPSEEK.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+DEEPSEEK.key},body:payloadJson,signal:ctrl.signal}).finally(()=>clearTimeout(to));
      if(!r.ok)continue;
      const data=await r.json();
      const content=(data?.choices?.[0]?.message?.content||'').replace(/\r/g,' ');
      let p=null;
      try{p=JSON.parse(content);}catch(e){try{p=JSON.parse(content.replace(/\n/g,' '));}catch(e2){}}
      if(!p||typeof p!=='object'){const m=content.match(/\{[\s\S]*\}/);if(m){try{p=JSON.parse(m[0].replace(/\n/g,' ').replace(/\r/g,' '));}catch(e3){}}}

}

async function runReport(){
  const rb=$('rBtn'); if(rb){rb.disabled=true;rb.textContent='ReportAgent 思考中……';}
  const finalState=CH[totalCh-1].state;
  const feed=CH.map(c=>c.res);

向世俗基督教，亲手给了尼采背叛感","innerConflict":"天才 vs 被祛魅","ties":["nietzsche","cosima"]}},{"id":"foerster","name":"伯恩哈德·福尔斯特","role":"妹夫 · 反犹鼓动者","initials":"福","traits":["反犹","殖民梦想","丈夫"],"goals":["建立『纯粹』的德意志殖民地","靠近民族主义权力"],"bio":"伊丽莎白之夫。1880 年代领衔反犹请愿，1886 年偕妻远赴巴拉圭建『新日耳曼尼亚』殖民地（终失败）。其 völkisch 倾向与尼采的『好欧洲人』立场正相对立。","relToN":"妹夫；其反犹立场与尼采相反，后被遗稿挪用牵连","voice":"激昂、排他、朝向『纯洁』。","psyche":{"archetype":"排他的殖民梦想家","desire":"建立「纯粹」的德意志殖民地","fear":"颓废侵蚀民族","contradiction":"以纯洁之名行排斥","mask":"激昂、朝向「纯洁」","truth":"他的立场与尼采的「好欧洲人」正相反","wound":"反犹请愿者的执念","innerConflict":"理想 vs 偏执","ties":["elisabeth"]}},{"id":"salis","name":"梅塔·冯·萨利斯","role":"贵族弟子 · 忠诚友人","initials":"梅","traits":["贵族出身","独立","忠诚","聪慧"],"goals":["成为尼采晚年的手与眼","守护其未被驯化的部分"],"bio":"瑞士贵族、最早的女性哲学博士之一。1880 年代结识尼采并倾心追随，崩溃后曾协助奥维贝克照料、整理，是少数真正懂他又不占有的女性。","relToN":"忠诚弟子与友人；崩溃后守护其人","voice":"端庄、清醒、含情。","psyche":{"archetype":"贵族之身的守护者","desire":"成为尼采晚年的手与眼","fear":"他未被驯化的部分被磨灭","contradiction":"忠诚却不占有","mask":"端庄、清醒、含情","truth":"她懂他，却不曾索求","wound":"女性哲人处境下的清醒","innerConflict":"守护 vs 距离","ties":["nietzsche","overbeck"]}},{"id":"deussen","name":"保罗·多伊森","role":"少年挚友 · 印度学家","initials":"道","traits":["忠诚","学者","温厚"],"goals":["守住少年情谊","以学术延续古典"],"bio":"自舒尔普福塔同窗起便是尼采挚友，后成印度学大家。屡屡在尼采困顿时伸出援手，是少数穿越其一生风暴而未离散的朋友。","relToN":"少年同窗、终身挚友","voice":"温和、怀旧、笃定。","psyche":{"archetype":"少年同窗的挚友","desire":"守住少年情谊","fear":"友人走得太远","contradiction":"温厚地目送他远去","mask":"温厚、怀旧、笃定","truth":"他认得尼采眼里的火，从舒尔普福塔起","wound":"一生友谊穿越风暴却渐行渐远","innerConflict":"靠近 vs 不打扰","ties":["nietzsche"]}},{"id":"rohde","name":"埃尔温·罗德","role":"古典学者 · 渐远的朋友","initials":"洛","traits":["才学","谨慎","渐冷"],"goals":["守住学术的岸","与尼采保持距离"],"bio":"《悲剧的诞生》的题献对象之一。早年与尼采亲密，后因尼采越走越远、思想愈发狂野而渐生隔阂，是『朋友离散』这一主题的代表。","relToN":"早年密友、后来渐远","voice":"客气、保留、略带惋惜。","psyche":{"archetype":"渐远的朋友","desire":"守住学术的岸","fear":"被尼采的狂野卷走","contradiction":"曾密友，后疏离","mask":"客气、保留、略带惋惜","truth":"他选择留在岸上","wound":"「朋友离散」的代价","innerConflict":"情谊 vs 安全距离","ties":["nietzsche"]}},{"id":"public","name":"读者公众（沉默的多数）","role":"时代的数","initials":"众" ":"偶得叔本华《作为意志与表象的世界》，如「一记后脑勺的闷击」：世界是盲目的意志。"},{"year":"1869","who":"nietzsche","text":"24 岁未取博士即受聘巴塞尔，放弃普鲁士籍，终身无国籍。"},{"year":"1872","who":"nietzsche","text":"《悲剧的诞生》让他与整个语文学界决裂；他选择先做一个不合时宜的人。"},{"year":"1878","who":"nietzsche","text":"《人性，太人性》标志与瓦格纳美学与友谊的双重断裂。"},{"year":"1879","who":"nietzsche","text":"辞巴塞尔教职，病痛缠身，成为无国之人，在阿尔卑斯间漂泊。"},{"year":"1881","who":"nietzsche","text":"8 月，西尔瓦普拉纳湖，一个念头击中他：这一切会无限次再来——永恒轮回。"},{"year":"1882","who":"nietzsche","text":"与露·莎乐美、保罗·李构想「自由精神」；三次求婚被拒，那张鞭子照由他设计、鞭子握在她手。"},{"year":"1883","who":"nietzsche","text":"《查拉图斯特拉如是说》借先知之口宣告「上帝已死」与「超人」；同年瓦格纳逝世。"},{"year":"1885","who":"nietzsche","text":"靠年金自费出版，一生仅售约 114 册；他烧得比任何时候都亮，也知正输给时间。"},{"year":"1886","who":"nietzsche","text":"《善恶之彼岸》接续；视角主义≠相对主义，是他反复划下的界线。"},{"year":"1887","who":"nietzsche","text":"《论道德的谱系》；特赖奇克 1880 的德国反犹转向中，他始终站在反犹的对立面——「好欧洲人」。"},{"year":"1888-07","who":"nietzsche","text":"在恩加丁/西尔瓦普拉纳写作《偶像的黄昏》，以焚身之速。"},{"year":"1888-08","who":"nietzsche","text":"《偶像的黄昏》付印（瑙曼）；他欲献给科西玛·瓦格纳，遭冷遇。"},{"year":"1888-09","who":"nietzsche","text":"都灵，写作爆发：《反基督》《瞧这个人》《尼采反对瓦格纳》接连倾泻。"},{"year":"1888-09","who":"wagner","text":"《尼采反对瓦格纳》清算早年半神：帕西法尔之后，他视瓦格纳为『世俗化基督教』的背叛者。"},{"year":"1888-10","who":"brandes","text":"勃兰兑斯在哥本哈根大学开设尼采讲座，第一批系统讲授者，带来最早声名。"},{"year":"1888-10","who":"nietzsche","text":"给勃兰兑斯回信致谢；在都灵的廉价旅馆里，思想与身体同时到达顶点与边缘。"},{"year":"1888-11","who":"cosima","text":"尼采致信科西玛欲献书，被冷遇；瓦格纳转向《帕西法尔》的世俗基督教，他视为背叛。"},{"year":"1888-11","who":"lou","text":"莎乐美在远方想起那个设计鞭子照的人；把心碎留给自己，继续走自己的思想之路。"},{"year":"1888-11","who":"nietzsche","text":"给友人寄出愈来愈怪的信；孤独与写作狂热同时攀升。"},{"year":"1888-12","who":"king","text":"以「狄奥尼索斯」之名给意大利国王翁贝托一世写神谕般的明信片。"},{"year":"1888-12","who":"bismarck","text":"给俾斯麦写夸张明信片；在尼采眼中，他是「末人」政治的象征。"},{"year":"1888-12","who":"burckhardt","text":"给布克哈特写信：「我已让人枪决了该亚法。」语气由狂喜转向神谕。"},{"year":"1888-12","who":"burckhardt","text":"布克哈特惊觉不祥，把信转给奥维贝克——这间接促成了救援。"},{"year":"1889-01-03","who":"driver","text":"都灵卡罗·阿尔贝托街，车夫鞭打一匹不肯动的老马。"},{"year":"1889-01-03","who":"nietzsche","text":"尼采抱住马颈痛哭，随即崩溃；此后由妹妹伊丽莎白接管遗产。"},{"year":"1889-01","who":"overbeck","text":"奥维贝克亲赴都灵，将已崩溃的尼采接出——唯一在终点伸手的人。"},{"year":"1889-01","who":"salis","text":"梅塔·冯·萨利斯后赶来，成为少数在崩溃现场之外仍守护他、照料他的人。"},{"year":"1889-01","who":"mother","text":"崩溃后的最初岁月，母亲弗兰齐斯卡在瑙姆堡照料他。"},{"year":"1890","who":"elisabeth","text":"伊丽莎白从巴拉圭返乡，接管遗稿，按自身倾向剪辑。"},{"year":"1890","who":"foerster","text":"福尔斯特的『新日耳曼尼亚』巴拉圭殖民地在经济困境中勉强维系，后彻底失败。"},{"year":"1900","who":"nietzsche","text":"8 月 25 日逝世于魏玛；真正的声名要在死后、经误解与挪用才骤然降临。"},{"year":"身后","who":"elisabeth","text":"伪造《权力意志》（蒙提纳里考订）；其 völkisch 倾向使遗稿被纳粹挪用——非尼采所愿。"},{"year":"身后","who":"fame","text":"「思想者之死」多为修辞与附会；金发野兽是「高贵兽」（心理类型非种族）；主动/被动虚无主义须分清。"},{"year":"概念","who":"nietzsche","text":"权力意志：遗稿由妹妹剪辑伪造，原笔记并无此系统书名；当心方法论的误读。"},{"year":"概念","who":"nietzsche","text":"永恒轮回三读法：宇宙论/伦理考验/存在肯定；他多以「最重的分量」作肯定式解读。"},{"year":"概念","who":"nietzsche","text":"视角主义：世界无「自在之物」，只有视角；≠相对主义（Nehamas 1985 vs Clark 1990）。"},{"year":"概念","who":"nietzsche","text":"超人：在已出版的晚期著作中其实「退出」；它是方向，不是种族等级。"},{"year":"概念","who":"nietzsche","text":"上帝之死 = 父亲之死的精神升华；他既哀悼又庆祝这「迟到的悼词」。"},{"year":"概念","who":"nietzsche","text":"禁欲理想：他解剖其 physiology，既揭其虚无主义，也承认其曾护持思想。"},{"year":"时代","who":"nietzsche","text":"Bildung（教化）既锻造他也囚禁他；他既赞美又警惕普鲁士式自我锻造。"},{"year":"时代","who":"nietzsche","text":"阅读革命与年金自费出版使其孤绝；19 世纪末妇女 1900 才进大学，莎乐美是例外。"},{"year":"时代","who":"nietzsche","text":"反犹转向（特赖奇克 1880）中他铁证反犹；「好欧洲人」是其立场。"},{"year":"时代","who":"nietzsche","text":"疗养地理（瑞士山间、都灵、尼斯）构成其身体与思想的逃亡地图。"},{"year":"时代","who":"nietzsche","text":"世俗化（费尔巴哈·施特劳斯·勒南）抽走世界的「目的」；他接下这把刀。"},{"year":"时代","who":"nietzsche","text":"Kulturkampf 与 Sonderweg 构成德意志语境；他既利用又疏离这语境。"},{"year":"时代","who":"nietzsche","text":"达尔文与海克尔动摇目的论；热力学熵与「轮回」仅为弱关联，当心过度引申。"},{"year":"时代","who":"nietzsche","text":"Kraepelin 1883 的精神病学、GPI（梅毒）1913 才确证——其病因学至今无共识。"},{"year":"接受","who":"fame","text":"勃兰兑斯 1888 贵族激进 → 伊丽莎白+纳粹 → 海德格尔 1936-46 → 考夫曼 1950 → 法国理论 → 女性主义 → 当代。"},{"year":"接受","who":"lou","text":"莎乐美日后著文回忆，既亲近又不被其占有，是尼采未解开的那个扣。"},{"year":"接受","who":"overbeck","text":"奥维贝克的清醒与忠诚，使其成为尼采研究中少有的可信友人视角。"},{"year":"接受","who":"salis","text":"萨利斯以贵族之身成为其晚年忠实弟子，并在崩溃后守护其人，留下珍贵见证。"},{"year":"接受","who":"deussen","text":"多伊森自少年至暮年维护这份友谊，是少数穿越其一生风暴而未离散的人。"},{"year":"接受","who":"rohde","text":"罗德由密友渐远，折射出尼采思想越界后「朋友离散」的代价。"},{"year":"写作狂潮","who":"nietzsche","text":"1888 一年他写下五部：《偶像的黄昏》《反基督》《瞧这个人》《尼采反对瓦格纳》《狄奥尼索斯-酒神颂歌》——焚身之速。"},{"year":"写作狂潮","who":"gast","text":"加斯特为病弱的他一笔一画誊抄校样，几近盲眼的尼采依赖他的手完成付印。"},{"year":"政治","who":"epoch","text":"1888 德意志「三皇之年」：威廉一世崩，腓特烈三世在位 99 天，威廉二世继位。"},{"year":"政治","who":"bismarck","text":"俾斯麦 1890 年 3 月去职，铁血现实政治落幕，新帝转向个人统治。"},{"year":"政治","who":"foerster","text":"福尔斯特 1880 年代领衔反犹请愿，公开与尼采的立场对立。"},{"year":"医学","who":"illness","text":"晚年疾患包括左眼近乎失明、剧烈偏头痛、呕吐与间歇性谵妄；脑膜瘤假说（1947 考夫曼）最受当代学者青睐。"},{"year":"医学","who":"nietzsche","text":"他将病痛炼成熔炉：在黑暗与阵痛里，句子反而磨得更亮。"},{"year":"身后","who":"wagner","text":"瓦格纳死后被奉为德意志祭司；尼采先追随后清算，其人成了他终身未愈的俄狄浦斯结。"},{"year":"概念","who":"nihilism","text":"他区分两种虚无主义：消极（价值坍塌后的瘫痪）与积极（以锤重估、让创造可能）。"},{"year":"概念","who":"epoch","text":"世纪末的世俗化与机器登场，人被悬在「上帝退场」与「新意义未立」之间——这正是他诊断的时代。"}],"chronology":[{"tick":0,"date":"1888-07","label":"恩加丁 · 写作《偶像的黄昏》","anchor":true,"event":"在瑞士高处的湖畔，他以焚身之速写下《偶像的黄昏》——把一切价值重新放上审判台。","actors":["nietzsche","illness","fame"]},{"tick":1,"date":"1888-08","label":"付印 · 欲献科西玛遭冷遇","anchor":true,"event":"《偶像的黄昏》由瑙曼付印。他欲将此书献给科西玛·瓦格纳，回音是沉默与冷遇。","actors":["nietzsche","naumann","cosima"]},{"tick":2,"date":"1888-09","label":"都灵 · 超新星爆发","anchor":true,"event":"都灵的秋。他接连写下《反基督》《瞧这个人》《尼采反对瓦格纳》，烧得比任何时候都亮，也知正输给时间。","actors":["nietzsche","illness","gast"]},{"tick":3,"date":"1888-09","label":"瓦格纳的幽灵 · 《尼采反对瓦格纳》","anchor":true,"event":"在《尼采反对瓦格纳》里，他清算早年的半神：帕西法尔之后，他视瓦格纳为背叛者，却仍绕不开那道阴影。","actors":["nietzsche","wagner","cosima"]},{"tick":4,"date":"1888-10","label":"哥本哈根的第一缕声名","anchor":true,"event":"勃兰兑斯在哥本哈根大学开设尼采讲座——第一批系统讲授他的人，带来最早一缕声名。","actors":["brandes","nietzsche","fame"]},{"tick":5,"date":"1888-11","label":"写给瓦格纳圈 · 莎乐美在远方","anchor":true,"event":"他致信科西玛欲献书再遭冷遇；莎乐美在远方想起那个设计鞭子照的人。孤独与狂热一同攀升。","actors":["nietzsche","cosima","lou"]},{"tick":6,"date":"1888-12 上","label":"神谕明信片 · 致国王与宰相","anchor":true,"event":"以「狄奥尼索斯」之名，他给意大利国王翁贝托一世、给俾斯麦写下神谕般的明信片；时代本身在身后转动。","actors":["nietzsche","king","bismarck","epoch"]},{"tick":7,"date":"1888-12 下","label":"「我已让人枪决了该亚法」","anchor":true,"event":"他给布克哈特写下那封狂信。布克哈特惊觉不祥，把信转给奥维贝克。","actors":["nietzsche","burckhardt","overbeck"]},{"tick":8,"date":"1889-01-03","label":"都灵广场 · 抱马","anchor":true,"event":"卡罗·阿尔贝托街。车夫扬鞭抽打一匹不动的老马。尼采抱住马颈痛哭，防线溃决——这一幕之后，世界仍要继续。","actors":["nietzsche","driver","horse","overbeck"]},{"tick":9,"date":"1889-01","label":"奥维贝克接出 · 母亲照料","anchor":true,"event":"奥维贝克赶赴都灵，将已崩溃的尼采接出；最初的岁月，母亲在瑙姆堡照料他。","actors":["overbeck","mother","nietzsche","salis"]},{"tick":10,"date":"1890","label":"伊丽莎白返乡 · 新日耳曼尼亚","anchor":true,"event":"伊丽莎白从巴拉圭返乡接管遗稿；其夫福尔斯特的『新日耳曼尼亚』殖民地在经济泥潭中勉强维系。","actors":["elisabeth","foerster","fame"]},{"tick":11,"date":"1900","label":"逝世 · 身后声名升起","anchor":true,"final":true,"event":"8 月 25 日他逝于魏玛。真正的声名要在死后、经误解与挪用才骤然降临——名字升起，亦被扭曲。","actors":["nietzsche","fame","elisabeth","public"]}],"sim":{"actionBank":{"nietzsche":["在廉价旅馆的灯下，以焚身之速写下又一行格言。","把一切价值重新放上审判台，问：这果真是我的手笔吗？","偏头痛袭来，他在黑暗里睁着眼，等光回来。","他听见体内的声音比街上的更响。","把《偶像的黄昏》的校样逐字念给空屋听。","在都灵的拱廊下踱步，与自己的影子辩论。","给科西玛的信折了又展，最终未寄。","将『狄奥尼索斯』签在明信片角落，像盖下私印。"],"elisabeth":["在远方盘算着如何接管兄长之名。","给兄长去信，关怀里裹着掌控。","在巴拉圭的殖民地上，把兄长的名字念给荒原听。","收到瑙姆堡的噩耗，她合上信，已开始盘算遗产。","把兄长的手稿按自己的秩序重新编号。","向访客展示『我兄长』，语气里藏着所有权。","在魏玛档案馆的蓝图里，描出自己的位置。","将一封旧信剪去一角，让意思悄悄转向。"],"lou":["在异国的书房里，想起那个设计鞭子照的人。","她把心碎留给自己，继续走自己的思想之路。","在圣彼得堡的沙龙里，把尼采的名字轻轻放回书架上。","提笔给旧日友人写信，写一半又停。","把那张鞭子照的反面，写上自己的批注。","在旅途中想起都灵，想起一个不肯停下的身影。","她合上他的书，对自己说：你不必成为他的注脚。","把关于他的回忆，锁进日后那本《回首》的草稿。"],"cosima":["以沉默作答，把尼采挡在圣坛之外。","守护瓦格纳的遗火，对献书不置一词。","在拜罗伊特的绿丘上，独自听一段前奏曲。","把尼采来信归入「不必回」的一叠。","向宾客转述瓦格纳，却略去那个叛徒的名字。","在遗稿中划掉所有提及尼采的注脚。","为《帕西法尔》的演出披上黑纱，像一场弥撒。","把献书之事说成『年轻人的失礼』，轻描淡写。"],"overbeck":["在巴塞尔的窗前忧虑，准备随时动身。","收到异常的信，他警觉起来。","登上南下的列车，把焦虑压进皮箱底层。","在都灵的旅店里，一眼认出那个不再认人的友人。","把崩溃的尼采扶上归程，像扶起一尊碎像。","向巴塞尔发电报告平安——措辞克制。","在病房外与医生低语，问还能撑多久。","把友人的残稿悄悄收好，怕落入错人之手。"],"gast":["替病弱的尼采一笔一画地抄写校样。","把誊清的稿纸递过去，带一点歉意。","把兄长口授的句子逐字记下，不敢添一字。","在深夜就着烛火校完最后一页，揉了揉眼。","把模糊的字迹猜出，盼自己没猜错。","把誊清稿抱在胸前，像抱着易碎的钟。","为付印之事往返邮局，靴底磨薄。","在兄长瘫倒后，仍每日把空白稿纸摆好——等他回来。"],"burckhardt":["读完那封狂信，眉头紧锁。","他决定把警报传给该传的人。","在讲堂上第一次念出尼采的名字，语气平静。","把那封狂信的副本寄往巴塞尔的同行。","夜里重读信，确认自己没有误读死亡的气息。","向奥维贝克交代：你去，我在此守着后方。"],"brandes":["在哥本哈根的讲台上，第一次系统讲起这个人。","把北欧的清明，借给一个几乎无人读他的名字。","把尼采的格言译成丹麦文，加进讲义。","在讲座后收到寥寥掌声，却已满足。","给都灵去信，落款是『你的北方读者』。","在报刊撰文，称他是『被低估的德意志良知』。"],"driver":["扬起鞭子，抽在不动的老马身上。","他不懂为何有人为一匹马落泪。","把鞭子抽空，马仍钉在原地。","朝围观者挥手，叫他们别挡道。","把车停在广场角，自己蹲下抽了口烟。","次日换了一匹马，照样赶路。"],"horse":["被轭、被鞭、被役使，它一动不动地挨着。","它沉默，像一块挨过太多鞭子的石头。","在轭下把重心换到另一条腿，依旧不动。","听见鞭声，耳朵向后贴了贴。","在雨里眨着眼，等这场役使过去。","被牵过石板路，蹄声空洞得像回声。","在集市旁卧下，把脸埋进前膝。","车夫抽罢走开，它仍停在原地。"],"king":["（未回复）一封来自陌生哲学家的神谕。","在宫中接过那张署名『狄奥尼索斯』的明信片。","把怪信递给侍从，问是否该回。","在阅兵式上想起那封荒诞来信，微微一笑。","御医呈上奏折，他只扫了一眼。","把哲学家的名字归进『有趣的疯子』一档。"],"bismarck":["（沉默的巨像，未理会）","把那封神谕归入『怪人』卷宗。","在地图上移一枚棋子，不置一词。","听说年轻皇帝的决心，微微眯眼。","在弗里德里希斯鲁的庄园里，把尼采的名字当谈资。","1890 年去职后，把旧信一并封存。"],"mother":["在瑙姆堡，母亲为远方的儿子忧心祈祷。","在瑙姆堡为远方的儿子缝补旧衣。","收到崩溃的消息，她连夜赶到他身边。","把药汤一勺勺喂进他嘴里，怕烫着他。","在病榻旁哼起幼年他熟悉的圣诗。","把他的手攥在掌心，像攥住一个走失的孩子。"],"naumann":["翻着账本，迟疑地接下又一本自费小册子。","把校样推回，请作者再减三页。","在莱比锡的库房里，给滞销书找个位。","听说作者疯了，叹口气，把尾款结了。","把《偶像的黄昏》的样本寄往几家报刊。","年终盘点，发现那人的书仍压着本钱。"],"illness":["阵痛自颅底升起，近盲与呕吐一同到来。","夺走他半日视力，让他摸黑找笔。","在深夜掀起呕吐，把书桌弄得一团糟。","把谵妄塞进他的梦，让他与死者辩论。","在左眼蒙上一层雾，久散不去。","趁他写作最狂时，悄悄收紧绳。"],"fame":["在身后的远方，一声迟来的回声正悄悄成形。","在巴黎一间沙龙，第一次有人读出他的姓。","在德语书店的角落，替他留出一个不起眼的格。","随着勃兰兑斯的讲座，向北悄悄挪了一步。","在身后某处亮起，像远处渐起的雷。","被伊丽莎白重新命名，悄悄换了一副面孔。","在二十世纪的课堂上，终于被人认真念出。","在战争年代被印上旗帜，已认不出本来面目。"],"wagner":["他的乐句在大厅里回荡，像一句不肯退场的审判。","帕西法尔之后，他以沉默回敬那本《反对瓦格纳》。","在绿丘剧院的暗处，听自己的乐句被反复演奏。","把尼采早年题献的信，锁进拜罗伊特的档案。","以《帕西法尔》的圣餐场景，回敬一切背叛。","在遗稿里留下对『叛徒』未写完的注脚。"],"foerster":["在请愿书上又添一个名字，朝向『纯洁的门槛』。","遥望巴拉圭，把殖民地读作对颓废的答复。","在巴拉圭的荒原上，丈量一块终将失败的田。","把反犹小册子塞进每一封家书。","向伊丽莎白描绘『新日耳曼尼亚』的蓝图。","听说殖民地欠债，仍高声谈着纯洁。"],"salis":["以贵族之身，甘做他晚年的手与眼。","在崩溃的阴影里，她守着他未被驯化的部分。","从苏黎世赶赴都灵，只为看他最后一眼。","替他挡下一位想利用疯名的访客。","在病榻旁为他朗读，怕他孤单。","把他的手稿悄悄抄副，留作见证。"],"deussen":["自舒尔普福塔的少年想起他眼里的火。","从印度学书斋寄去一封不带评判的问候。","翻出少年合影，寄往瑙姆堡示以旧情。 愿做被驯的那一个。","他求我三次；我三次把心放回自己怀里。","他教我自由，却要我留在他的影子里——这自由太窄。","我在三个男人之间走过，唯有他逼我问：你是谁？","那鞭子最终抽向的是他自己，不是我。","若重逢，我已不是当年那个二十二岁的姑娘。","他的疯狂，我早在他清醒时便已预见。","我写他，不为悼念，为还清一笔旧账。"],"cosima":["瓦格纳的圣坛不纳异端，哪怕他曾是门徒。","他的献书，我以沉默焚毁。","里夏德走了，我便是他未尽事业的唯一守门人。","那人以献书为名，行僭越之实。","我守的圣坛，不纳任何异端的香火。","沉默比反驳更体面，也比反驳更残忍。","他称我为背叛者——可先转身的，难道不是他？","艺术高于争论；我让乐句替我作答。"],"overbeck":["若那封信是求救，我会听见。","朋友之为朋友，是在终点伸手。","我早该来的，早三个月，早一年。","清醒是礼物，也是刑罚——我看着他坠，却拉不住。","做学者教我怀疑一切，唯独不怀疑这份情谊。","他写下的火，我只能以凉水相接。","若世人只记得他疯，我便记得他醒着的样子。","终点伸手的人——这身份，我宁愿从未需要。"],"gast":["我的手是他的眼睛；我抄下的，是他将盲去的字。","我愿做他的影，只要他还在写。","我的笔是他的桥；桥断了，他便到不了读者。","我多抄一遍，他便少耗一眼。","音乐本是我的，如今只为人作嫁衣——可我愿意。","他盲去时，我在他眼里看见光退潮。","若有一天他不再口授，我的手该何往？","我是影，可影也记得阳光的形状。"],"burckhardt":["清醒是一种负担，尤其当旁人开始狂喜。","我把警报传给会行动的人。","史家的冷静，是看清结局却无权改写的冷静。","我读过太多文明的黄昏，他的只是最近的一幕。","那封信里没有疯，只有被点燃的废墟。","我不出手则已，出手便是把人从悬崖边拉回。"],"brandes":["在北方的清冷里，我替一个无人读的人点灯。","迟来，但终会有人读他。","我点灯时不知这灯会烧成大火。","北方清冷，正适合安放一个滚烫的名字。","读者尚少，可少也是一种干净。","推介一个几乎无人读的人，是我与时代的赌。"],"driver":["马不动，便该抽；我懂的只有这一套。","那人为一匹牲口哭，倒显得我残忍。","马不动，是马的事；我赶路，是我的事。","那人为牲口哭，倒显得我像恶人。","哲学家的疯，与我何干。","鞭子是我的活计，不是我的罪。"],"horse":["（无声——它只是挨着，像所有被驱使之物。）","（无声——我不懂鞭子，只懂挨着。）","（无声——那抱住我脖子的人，比鞭子更烫。）","（无声——我也曾想动，可动也是为别人。）","（无声——轭的纹路，刻进我的皮。）","（无声——他哭的时候，我第一次被看见。）","（无声——若我动了，又会去往谁的车？）","（无声——我们都是被驱使之物，只是他是人。）"],"king":["（一封陌生哲学家的神谕？付之一炬，或付之一笑。）","（狄奥尼索斯——是个戏班名字么？）","（治国者读不懂疯子的情书。）","（那信上的字，比我的圣谕还狂。）","（让他写去，反正王冠不识笔迹。）","（我接到神谕，却不懂神是谁。）"],"bismarck":["（铁血宰相，不读格言；帝国的重量，不在书里。）","（一个写格言的疯子，竟也来指点江山。）","（新帝年轻，我老了——权力终要换手。）","（他称我为末人；我称他为病人。）","（帝国的事，容不下一句狂诗。）","（我的现实政治，比他的锤更实在。）"],"mother":["我的孩子，你写的是些什么，我读不懂，却仍为你祈祷。","你回来就好，回来就好。","我养大的小牧师，怎么成了谁都不懂的人。","他认得我时，我便知足；认不得时，我仍守着。","上帝收走了他的清醒，却留给我照看。","他笑的时候，像小时候那个在牧师宅的男孩。"],"naumann":["又一本小册子；账本比书页更诚实。","我印他，因他肯自费——读者，另说。","天才的滞销，是出版业最体面的亏损。","若有一本卖动了，我也算对得起这墨水。","他不在意销路，可我在意成本。","印吧，印吧——历史会替我付这笔账。"],"illness":["（阵痛里，我听见他思想的锤声。）","我夺走他的光，他却用黑暗磨亮句子。","（我既是敌，也是炉——他炼句，我送柴。）","（他越烧越亮，我越收越紧。）","（近盲时他写得更快，像怕光先走。）","（我不杀他，我只慢慢挪走他的世界。）"],"fame":["（在他生前，我只是远处的回声；死后，我将震耳欲聋。）","他们读我，却多半读错——这误读，也是我的。", 只哼了一声。","在去职那夜，独对空厅，久久未眠。"],"mother":["在瑙姆堡点起一支蜡烛，为他祈祷。","把他的旧毛衣叠好，放在膝上。","在窗台摆一束野花，等他睁眼。","把他的旧毛衣叠了又叠，舍不得放。","在睡前为他掖好被角，轻得像怕惊梦。","在祷告书里夹一张他的小像。"],"naumann":["翻着账本，叹口气，又接下一本。","把样本寄往莱比锡，石沉大海。","在书脊贴上价签，又觉得多余。","把退书捆好，堆进阁楼。","翻到某一页，被一句格言钉住半刻。","在账本边写：此人，仍需再观。"],"illness":["在颅底燃起一阵熟悉的灼痛。","夺走他半日的光，又松了手。","在他梦里塞进颠倒的字。","把药味留在枕上，像盖了章。","让偏头痛在清晨准时叩门。","在他握笔的手上，加一层不易见的颤。"],"fame":["在巴黎一间书房里，有人第一次念出他的姓。","在身后某处，回声又近了一分。","在魏玛档案馆的抽屉里，他的字被重新排过。","一份报纸把他的名字印成了头版。","二十年后的课堂，年轻人争着引用他。","被翻译成十二种语言，意思散了一地。","在战时海报上，他的胡子被画得很凶。","在旧书摊，一本小册子终于被人翻开了。"],"wagner":["在拜罗伊特的帷幕后，乐句不肯退场。","以一段前奏，回敬那本《反对瓦格纳》。","在乐谱边缘批下『此处念及那个叛徒』。","把尼采的名字从节目单轻轻抹去。","在遗稿箱底，翻出一封多年前的旧信。","让前奏曲在空厅回荡，像一声未了的审判。"],"foerster":["在请愿书添了新名，朝「纯洁」靠拢。","把巴拉圭的地图摊开，又合上。","在殖民账本上画一个乌有的丰收。","把反犹传单叠齐，像叠一份信仰。","在地图边缘写：此处将立新城。","把妻子的兄长名字，从请愿书抬头划掉。"],"salis":["替他挡下一位不速之客。","在深夜读他的手稿，做下批注。","在都灵的旅馆走廊，独自守到天明。","把一束白花放在他枕边。","在批注旁画一只小小的鹿（她的徽记）。","把他的呓语记在私密本子里。"],"deussen":["从印度学书斋寄出一封不带评判的信。","翻出少年时的合影，久久不语。","在梵文作业本边，写下一句德文格言。","把他的消息读给同僚，只说『老友病了』。","在地图把舒尔普福塔与都灵连了一条线。","深夜重读他旧信，灯芯爆了一下。"],"rohde":["在信里客气地祝他安好。","把关于他的记忆，锁进学术的抽屉。","在讲堂刻意不提他的名字。","把题献页夹进《悲剧的诞生》的复本。","在同事面前，只称他为『旧友尼采』。","把他的新书放进书架最里层。"],"public":["在书店角落，一本小册子落了灰。","某份报纸，第一次出现了他的名字——误拼的。","在旧书摊，一本被翻烂的小册子换了主人。","把他的格言抄在墙报，没人细读。","在战争的传单里，他的句子被截去半句。","在课堂笔记里，他的名字第一次写得端正。"],"epoch":["机器在鲁尔轰鸣，上帝在讲坛退场。","三皇之年落幕，新帝与旧相暗自角力。","在博览会的人潮里，新发明盖过了旧信仰。","把日历翻到 1900，像翻过一页未写的书。","在工厂的汽笛里，钟楼的声音越来越稀。","把『进步』写进标语，擦掉『意义』二字。"],"nihilism":["在坍塌处，等一柄锤落下。","它望进你，比你还想知道答案。","在空荡的教堂里，回声比经文更长。","把『为何』写进年轻人的日记。","在旗帜的缝隙里，窥见自己的影子。","在实验室的熵增曲线旁，冷笑了一声。"]},"telemetry":["信使穿过雨夜的都灵，靴声是唯一的钟。","出版社账本又添一笔赤字。","湖上的雾比昨日厚了三分。","颅底阵痛 σ 0.7↑","未寄出的信在抽屉里堆叠成山。","远方的讲座，听众多了三人。","老马的呼吸与城市的钟同步。","虚无主义在酒馆的争论里发芽。","帝国在地图边缘移动一枚棋子。","一本小册子落灰，书脊朝上。"]},"godPresets":[{"id":"lou_letter","label":"莎乐美回了信","desc":"她寄来一封温柔的回信，旧日裂痕被重新缝合。","state":{"love":10,"suffering":-7,"solitude":-6},"rel":{"lou":0.18,"elisabeth":-0.05},"note":"莎乐美在远方想起那个设计鞭子的人，提笔回了信。"},{"id":"horse_free","label":"那匹马被放生","desc":"车夫放下鞭子，老马被牵去草场。","state":{"suffering":-12,"will":8,"freedom":6},"rel":{"horse":0.12,"driver":0.12},"note":"都灵的马车夫放下了鞭子——历史改写，抱马那一幕不再发生。"},{"id":"publisher_hit","label":"出版商大卖","desc":"一本小册子意外走红，声名提前抵达。","state":{"fame":18,"suffering":-5,"thought":2},"rel":{"fame":0.18,"naumann":0.1},"note":"瑙曼的小册子意外在书店走红，名字提前抵达人群。"},{"id":"overbeck_early","label":"奥维贝克提前赶到","desc":"友人早一步抵达都灵，崩溃被拦下一半。","state":{"health":10,"will":6,"suffering":-7,"love":4},"rel":{"overbeck":0.15},"note":"奥维贝克比史实更早动身，在广场拦下了那个抱马的自己。"},{"id":"no_whip","label":"没有那一鞭","desc":"历史改写：抱马的鞭子始终没有落下。","state":{"suffering":-15,"will":12,"freedom":4},"rel":{"driver":0.1,"horse":0.12},"note":"那记抽在老马身上的鞭子，始终没有落下。"},{"id":"wagner_bless","label":"瓦格纳幽灵消散","desc":"旧日师尊的幽灵被请下神坛。","state":{"will":8,"thought":4,"freedom":6},"rel":{"wagner":0.2,"cosima":0.06},"note":"瓦格纳的幽灵在都灵的冬雾里散去，他第一次不必活在他人影子里。"}],"scholarship":[{"topic":"病因之争：梅毒说遭质疑","finding":"传统「神经梅毒（麻痹性痴呆）」诊断广受质疑。Leonard Sax（2003，《Journal of Medical Biography》）据病历指出尼采无梅毒典型症候——表情生动、反射正常、无震颤、崩溃后笔迹完好、言语流利——主张为缓慢生长的右眶后脑膜瘤。Orth 与 Trimble 提出额颞叶痴呆（FTD）；Cybulska 主张「双相情感障碍伴周期性精神病、随后血管性痴呆」；另有常染色体显性遗传脑血管病 CADASIL 假说（契合其父 35 岁脑疾早逝、弟夭折的家族史）。1898–1899 年至少两次中风，1900 年肺炎并发中风去世。结论：学界至今无共识。","sources":["Sax 2003《Journal of Medical Biography》","Orth & Trimble（额颞叶痴呆）","Cybulska（双相+血管性痴呆）","CADASIL 遗传说（荷兰医史团队）","Kraepelin 1883 精神病学"],"acts":[0,2,7]},{"topic":"《权力意志》系遗稿伪造","finding":"《权力意志》由妹妹伊丽莎白·福斯特-尼采与彼得·加斯特（科泽利茨）在尼采 1889 崩溃后，从其遗稿（Nachlass）中按主题剪裁汇编，1901 年初版、1906 年扩版，并非尼采本人规划之书。Nachlass 考订者 Mazzino Montinari（与 Giorgio Colli）称之为「历史性伪造」（historische Fälschung）；Walter Kaufmann（1950/1967）亦指出其选择性编排不能代表尼采意图。尼采本人在 1888 年 8 月已放弃该计划，改为《重估一切价值》。科利-蒙提纳里考订全集（KSA，1967 起，de Gruyter）以严格编年将遗稿拆穿了「权力意志之书」的神话。","sources":["Montinari & Colli《尼采著作全集》KSA（1967+）","Walter Kaufmann《Nietzsche: Philosopher, Psychologist, Antichrist》(1950)","Kaufmann 英译《The Will to Power》(1967)"],"acts":[8]},{"topic":"接受史：从寂寂无名到世纪惊雷","finding":"1888 年几乎无人读他；最早系统讲授者为勃兰兑斯（哥本哈根，1888）。20 世纪接受脉络：Georg Simmel《叔本华与尼采》(1907) 将其对伦理学的意义比于哥白尼之于宇宙学；Karl Jaspers《尼采》(1936) 勾连其生平与思想、病痛与孤独；Martin Heidegger 四卷本尼采讲座（1936–1946）称「真正的尼采在遗稿之中」。二战后 Walter Kaufmann 的译介（1950）在英语世界为其平反；Arthur Danto《Nietzsche as Philosopher》(1965) 为首位分析哲学专著；Alexander Nehamas《Nietzsche: Life as Literature》(1985) 与 Maudemarie Clark《Nietzsche on Truth and Philosophy》(1990) 深究视角主义（≠相对主义）。法国一侧：Bataille、Foucault、Deleuze（《Nietzsche et la philosophie》1962）、Derrida、Kofman 形成「法国尼采主义」。","sources":["Simmel 1907","Jaspers 1936","Heidegger 1936–1946","Kaufmann 1950","Danto 1965","Nehamas 1985","Clark 1990","Deleuze 1962"],"acts":[3,8]},{"topic":"纳粹挪用与伊丽莎白的角色","finding":"伊丽莎白主持魏玛尼采档案馆，并与希特勒、墨索里尼往来；纳粹选择性援引尼采语句以论证战争、支配与种族优等。学者指出这是对遗稿（尤其《权力意志》编排）的断章取义，并非尼采本意——尼采生前立场反犹、自居「好欧洲人」，与 völkisch 民族主义和种族主义正相对立。Alfred Bäumler 等纳粹阐释者刻意放大其政治化读法。","sources":["伊丽莎白·福斯特-尼采（魏玛档案馆）","Bäumler（纳粹阐释者）","Stanford 哲学百科《Nietzsche's Life and Works》"],"acts":[8]},{"topic":"莎乐美与 1882 的「三位一体」","finding":"1882 年尼采经保罗·李结识 21 岁的露·莎乐美。尼采两度求婚被拒，莎乐美主张建立无性的「自由精神三位一体」智识共同体。著名的「鞭子照」由尼采亲自设计：莎乐美坐于小车、手持皮鞭，尼采与李如马被系于车前（卢塞恩 Bonnet 照相馆）。同年 11 月莎乐美与李自其生活中消失，尼采致奥维贝克：「我真的要走向彻底的孤独了。」此后健康崩坏，次年写出《查拉图斯特拉》。","sources":["Lou Andreas-Salomé《Looking Back》（回忆录）","H.F. Peters《Zarathustra's Sister》","R. Vickers 等传记"],"acts":[4,5]},{"topic":"永恒轮回的三种读法","finding":"永恒轮回在学界有三种解读：宇宙论（有限状态、无限时间下同一配置必重复）、伦理考验（「你愿否这人生无限次重来？」的肯定式准则）、存在肯定（最重的分量=爱命运）。尼采多以「最重的分量」作肯定式解读；他从未在已出版著作中把轮回定为字面宇宙论，故该概念至今是争议焦点之一。超人（Übermensch）在晚期已出版著作中其实「退出」，它是方向而非种族等级。","sources":["《快乐的科学》卷四 §341（1882）","《查拉图斯特拉如是说》(1883–1885)","Nehamas 1985 / Clark 1990"],"acts":[2,7]},{"topic":"都灵崩溃的医学解释：中风与脑瘤之争","finding":"1889-01-03 崩溃后，学界对其病因长期争论。Leonard Sax（2003，《Journal of Medical Biography》）据病历指出尼采无梅毒典型症候——表情生动、反射正常、无震颤、崩溃后笔迹完好、言语流利——主张为缓慢生长的右眶后脑膜瘤。Orth 与 Trimble 提出额颞叶痴呆（FTD）；Cybulska 主张「双相情感障碍伴周期性精神病、随后血管性痴呆」；另有常染色体显性遗传脑血管病 CADASIL 假说（契合其父 35 岁脑疾早逝、弟夭折的家族史）。1898–1899 年至少两次中风，1900 年肺炎并发中风去世。都灵广场抱马一幕大概率为附会——无同期现场见证，首见于奥维贝克日后转述与 1890 年代传记。","sources":["Sax 2003《Journal of Medical Biography》","Orth & Trimble（额颞叶痴呆 FTD）","Cybulska（双相+血管性痴呆）","CADASIL 遗传说（荷兰医史团队）","Kraepelin 1883 精神病学","都灵市政记录（无现场记载）"],"acts":[8,9]},{"topic":"布克哈特与那封『枪决该亚法』的狂信","finding":"1888-12，尼采给巴塞尔史家布克哈特去信，宣称「我已让人枪决了该亚法」，语气由狂喜转向神谕。布克哈特敏锐读出死亡气息，将信转交奥维贝克，间接促成救援。此信是崩溃前最清晰的同期文本证据之一；布克哈特之「警觉的史家」角色由此确立。Jaspers 与后世学者均视此信为诊断关键。","sources":["Nietzsche Briefwechsel (KGB)","Jaspers《Nietzsche》(1936)","布克哈特书信集（Jacob Burckhardt Briefe）"],"acts":[7]},{"topic":"勃兰兑斯：最早的系统推介者","finding":"1888 年秋，丹麦批评家 Georg Brandes 在哥本哈根大学开设关于尼采的系列讲座，是史上第一批系统讲授尼采思想的人；尼采本人致信致谢。彼时德文原版几乎无人问津，这缕声名来自「北方」。Brandes 日后将尼采与易卜生、斯特林堡并列为现代的突破者，其 1889 起在欧陆的推介为尼采进入英语与北欧世界铺路。","sources":["Brandes《Friedrich Nietzsche》(1914 演讲结集)","尼采—勃兰兑斯通信 (KGB)","哥本哈根大学档案"],"acts":[4]},{"topic":"奥维贝克：终点伸手的人与友谊的限度","finding":"1889-01，奥维贝克接布克哈特警报后亲赴都灵，将已崩溃的尼采接出，是极少在终点伸手的人；其妻 Ida 亦参与照料。奥维贝克事后谨慎保护友人遗稿与名誉，拒绝将崩溃浪漫化——他整理的回忆是尼采研究中少有的可信友人视角。他与萨利斯、布克哈特构成崩溃救援网络，亦提示「友谊」在疯狂面前的清醒限度。","sources":["奥维贝克回忆录（Franz Overbeck 书信与回忆）","Ida Overbeck 书信","梅塔·冯·萨利斯见证"],"acts":[8,9]},{"topic":"母与妹：崩溃后的照料之争","finding":"崩溃后的最初岁月，母亲弗兰齐斯卡在瑙姆堡照料病躯的尼采；1890 年伊丽莎白自巴拉圭返乡，逐步接管其人身与遗稿。二人照护理念相左：母亲慈爱却读不懂其思，伊丽莎白则以「定义者」自居、按自身民族主义倾向剪辑遗稿。照料权之争，实则是「谁来代言尼采」之争——医养与诠释在此合流。","sources":["弗兰齐斯卡·尼采书信","伊丽莎白《Das Leben Friedrich Nietzsches》(1895/1904 传记)","Montinari 考订全集 KSA"],"acts":[9,10]},{"topic":"逝世与『脑软化』诊断","finding":"1900-08-25 尼采逝于魏玛。其死亡诊断常被简写为「脑软化」（encephalomalacia），源于其父 1849 年同样的模糊诊断；现代医史视为对晚期神经退行性病变（多次中风、可能的脑膜瘤/FTD）的通俗说法，并非独立病名。肺炎并发最后一次中风为直接死因。『思想者之死』多为修辞与附会。","sources":["魏玛死亡证明","Sax 2003","医史学界综述（神经梅毒/脑膜瘤/FTD 之争）","Nietzsche Briefwechsel (KGB)"],"acts":[11]},{"topic":"世纪虚无主义：尼采诊断的时代氛围","finding":"尼采所谓「降临中的虚无主义」对应世纪末（fin-de-siècle）欧洲：世俗化抽走世界目的、机器与资本登场、达尔文与海克尔动摇目的论。他区分消极（价值坍塌后瘫痪）与积极（以锤重估）两种。这一诊断既是 1888 的背景，也预言了 20 世纪的价值危机；Aschheim 等指出其如何成为后世政治挪用与存在主义重构的共同土壤。","sources":["《论道德的谱系》(1887)","《偶像的黄昏》(1888)","Aschheim《The Nietzsche Legacy in Germany 1890–1990》(1992)","尼采—布克哈特/奥维贝克语境"],"acts":[6,11]},{"topic":"《偶像的黄昏》付印与献书遭冷遇","finding":"1888-08《偶像的黄昏》由瑙曼（C.G. Naumann）付印，尼采本欲以此书献给科西玛·瓦格纳，回音是沉默与冷遇；同年 11 月再致信科西玛献书仍遭拒。这两次冷遇标志其与瓦格纳圈彻底决裂，亦催生《尼采反对瓦格纳》。献书之愿与遭拒，折射他既想和解又必清算的矛盾。","sources":["《偶像的黄昏》(1888, 瑙曼)","尼采—加斯特/科西玛通信 (KGB)","《尼采反对瓦格纳》(1888)"],"acts":[1,3,5]}]};
